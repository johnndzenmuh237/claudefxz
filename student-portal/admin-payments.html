<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Verification | Claudefx Academy Pro</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../assets/images/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/darkmode.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <style>
    body{padding:2rem;max-width:1100px;margin:0 auto;}
    .adm-tabs{display:flex;gap:.5rem;margin:1.5rem 0;}
    .adm-tabs button{background:var(--color-dark-3);border:1px solid rgba(255,255,255,.08);color:var(--color-text-secondary);padding:.5rem 1rem;border-radius:8px;cursor:pointer;}
    .adm-tabs button.active{color:var(--color-gold);border-color:var(--color-gold);}
    .adm-card{background:var(--color-dark-2);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
    .adm-row{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start;}
    .adm-meta{font-size:.8rem;color:var(--color-text-secondary);line-height:1.7;}
    .adm-meta strong{color:var(--color-text-primary);}
    .adm-actions{display:flex;gap:.5rem;flex-shrink:0;}
    .adm-reject-box{display:none;margin-top:1rem;}
    .adm-reject-box.open{display:block;}
    .adm-reject-box select,.adm-reject-box textarea{width:100%;margin-bottom:.5rem;}
    .badge-method{font-size:.65rem;padding:.15rem .5rem;border-radius:999px;background:rgba(255,255,255,.08);}
  </style>
</head>
<body>
<div class="page-loader"><div class="loader-ring"></div></div>

<div class="adm-row" style="align-items:center;margin-bottom:1rem;">
  <h1 style="font-size:1.5rem;">Payment Verification</h1>
  <a href="dashboard.html" class="btn btn-outline btn-sm">← Back to Dashboard</a>
</div>

<div class="adm-tabs">
  <button data-tab="pending" class="active">Pending</button>
  <button data-tab="audit">Audit Log</button>
</div>

<div id="admPending"></div>
<div id="admAudit" style="display:none;"></div>

<script type="module">
  import { auth, db } from "../assets/js/firebase-config.js";
  import { requireAdmin } from "../assets/js/auth-helpers.js";
  import { collection, query, where, getDocs, doc, updateDoc, deleteDoc, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = (t) => t && t.toDate ? t.toDate().toLocaleString() : '';
  let adminEmail = '';

  const REJECT_REASONS = [
    'Transaction could not be verified', 'Incorrect amount', 'Invalid transaction ID',
    'Transaction already used', 'Wrong payment recipient / wallet', 'Wrong network',
    'Payment not received', 'Other',
  ];

  function methodLabel(o) {
    if (o.method === 'momo') return o.providerName || (o.provider === 'orange' ? 'Orange Money' : 'MTN MoMo');
    return 'Crypto — ' + (o.cryptocurrency || '');
  }
  const refOf = (o) => o.transactionId || o.transactionHash || o.refKey || '';

  async function logAudit(o, action, extra = {}) {
    try {
      await addDoc(collection(db, 'auditLog'), { orderId: o.id, action, by: adminEmail, at: serverTimestamp(), ...extra });
    } catch (e) { console.warn('audit log failed', e); }
  }

  async function loadPending() {
    const container = document.getElementById('admPending');
    container.innerHTML = '<p style="color:var(--color-text-secondary);">Loading…</p>';
    const snap = await getDocs(query(collection(db, 'orders'), where('status', '==', 'pending')));
    const orders = snap.docs.map(d => d.data()).sort((a, b) => (a.submittedAt?.seconds || 0) - (b.submittedAt?.seconds || 0));
    if (!orders.length) { container.innerHTML = '<p style="color:var(--color-text-secondary);">No pending payments. 🎉</p>'; return; }
    container.innerHTML = '';
    const byId = {};
    orders.forEach((order) => {
      byId[order.id] = order;
      const card = document.createElement('div');
      card.className = 'adm-card';
      card.innerHTML = `
        <div class="adm-row">
          <div class="adm-meta">
            <div><strong>${esc(order.buyerEmail || order.uid)}</strong> — <span class="badge-method">${esc(methodLabel(order))}</span></div>
            <div><strong>Product:</strong> ${esc(order.title)}</div>
            <div><strong>Amount expected:</strong> $${esc(order.priceUsd)}${order.amountXaf ? ' (' + Number(order.amountXaf).toLocaleString() + ' CFA)' : ''}</div>
            <div><strong>Reference:</strong> ${esc(refOf(order))}</div>
            ${order.senderPhone ? `<div><strong>Sender phone:</strong> ${esc(order.senderPhone)}</div>` : ''}
            ${order.senderWallet ? `<div><strong>Sender wallet:</strong> ${esc(order.senderWallet)}</div>` : ''}
            ${order.network ? `<div><strong>Network:</strong> ${esc(order.network)}</div>` : ''}
            <div><strong>Submitted:</strong> ${esc(fmtDate(order.submittedAt))}</div>
            <div><strong>Order ID:</strong> ${esc(order.id)}</div>
          </div>
          <div class="adm-actions">
            <button class="btn btn-primary btn-sm" data-approve="${esc(order.id)}"><i class="fas fa-check"></i> Approve</button>
            <button class="btn btn-outline btn-sm" data-reject-toggle="${esc(order.id)}"><i class="fas fa-times"></i> Reject</button>
          </div>
        </div>
        <div class="adm-reject-box" id="reject-${esc(order.id)}">
          <select id="reason-select-${esc(order.id)}">${REJECT_REASONS.map((r) => `<option>${esc(r)}</option>`).join('')}</select>
          <textarea id="reason-notes-${esc(order.id)}" rows="2" placeholder="Additional notes (optional)"></textarea>
          <button class="btn btn-danger btn-sm" data-confirm-reject="${esc(order.id)}">Confirm Rejection</button>
        </div>`;
      container.appendChild(card);
    });

    container.querySelectorAll('[data-approve]').forEach((btn) => btn.addEventListener('click', async () => {
      if (!confirm('Confirm that you have verified this payment through your own MTN/Orange/crypto records?')) return;
      btn.disabled = true;
      const order = byId[btn.dataset.approve];
      try {
        await updateDoc(doc(db, 'orders', order.id), { status: 'approved', verifiedAt: serverTimestamp(), verifiedBy: adminEmail, rejectionReason: null });
        await logAudit(order, 'approved');
        loadPending();
      } catch (err) { alert(err.message); btn.disabled = false; }
    }));
    container.querySelectorAll('[data-reject-toggle]').forEach((btn) => btn.addEventListener('click', () => {
      document.getElementById('reject-' + btn.dataset.rejectToggle).classList.toggle('open');
    }));
    container.querySelectorAll('[data-confirm-reject]').forEach((btn) => btn.addEventListener('click', async () => {
      const order = byId[btn.dataset.confirmReject];
      const reasonSelect = document.getElementById('reason-select-' + order.id).value;
      const notes = document.getElementById('reason-notes-' + order.id).value.trim();
      const reason = notes ? `${reasonSelect}: ${notes}` : reasonSelect;
      btn.disabled = true;
      try {
        await updateDoc(doc(db, 'orders', order.id), { status: 'rejected', rejectionReason: reason, verifiedAt: serverTimestamp(), verifiedBy: adminEmail });
        // Free the transaction ID so the buyer can resubmit a corrected one — unless it was rejected as a reused ID.
        if (order.refKey && reasonSelect !== 'Transaction already used') {
          try { await deleteDoc(doc(db, 'usedReferences', order.refKey)); } catch (e) { console.warn(e); }
        }
        await logAudit(order, 'rejected', { reason });
        loadPending();
      } catch (err) { alert(err.message); btn.disabled = false; }
    }));
  }

  async function loadAudit() {
    const container = document.getElementById('admAudit');
    container.innerHTML = '<p style="color:var(--color-text-secondary);">Loading…</p>';
    const snap = await getDocs(collection(db, 'auditLog'));
    const entries = snap.docs.map(d => d.data()).sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0)).slice(0, 100);
    if (!entries.length) { container.innerHTML = '<p style="color:var(--color-text-secondary);">No activity yet.</p>'; return; }
    container.innerHTML = entries.map((e) => `
      <div class="adm-card" style="padding:.85rem 1.25rem;"><div class="adm-meta">
        <strong>${esc(String(e.action).toUpperCase())}</strong> by ${esc(e.by)} — Order ${esc(e.orderId)}
        ${e.reason ? `<br>Reason: ${esc(e.reason)}` : ''}
        <br><span style="color:var(--color-text-muted);">${esc(fmtDate(e.at))}</span>
      </div></div>`).join('');
  }

  document.querySelectorAll('.adm-tabs button').forEach((btn) => btn.addEventListener('click', () => {
    document.querySelectorAll('.adm-tabs button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('admPending').style.display = btn.dataset.tab === 'pending' ? 'block' : 'none';
    document.getElementById('admAudit').style.display = btn.dataset.tab === 'audit' ? 'block' : 'none';
    if (btn.dataset.tab === 'audit') loadAudit();
  }));

  requireAdmin().then(({ user }) => { adminEmail = user.email || user.uid; loadPending(); }).catch(() => {});
</script>
</body>
</html>
