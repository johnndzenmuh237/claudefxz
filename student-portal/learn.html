  <style>
    .lib-empty{text-align:center;padding:4rem 1.5rem;color:var(--color-text-secondary);}
    .lib-empty i{font-size:2.5rem;color:var(--color-gold);margin-bottom:1rem;display:block;}
    .lib-item{background:var(--color-dark-2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;}
    .lib-item-head{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;}
    .lib-item-head i{font-size:1.3rem;color:var(--color-gold);}
    .lib-item-head h3{font-size:1.05rem;margin:0;}
    .lib-item-head .type-badge{font-size:.65rem;background:rgba(201,168,76,.12);color:var(--color-gold);padding:.15rem .55rem;border-radius:999px;margin-left:auto;}
    .lib-file-row{display:flex;align-items:center;gap:.75rem;padding:.65rem 0;border-top:1px solid rgba(255,255,255,.05);}
    .lib-file-row:first-of-type{border-top:none;}
    .lib-file-row .fname{flex:1;font-size:.88rem;color:var(--color-text-primary);}
    .lib-file-row i.ftype{color:var(--color-text-muted);width:18px;}
    .lib-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:none;align-items:center;justify-content:center;padding:1rem;}
    .lib-modal-overlay.open{display:flex;}
    .lib-modal{background:var(--color-dark-2);border-radius:14px;width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
    .lib-modal-head{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.08);}
    .lib-modal-head .title{font-weight:600;flex:1;}
    .lib-modal-body{flex:1;overflow:auto;background:#000;display:flex;align-items:center;justify-content:center;min-height:300px;}
    .lib-modal-body iframe,.lib-modal-body video{width:100%;height:70vh;border:none;}
  
    .ln-wrap{max-width:1100px;margin:0 auto;}
    .ln-card{background:var(--color-dark-2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:1.4rem;margin-bottom:1.1rem;}
    .ln-card h3{font-size:1.05rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.5rem;}
    .ln-card h3 i{color:var(--color-gold);}
    .ln-card p{font-size:.88rem;color:var(--color-text-secondary);margin:0 0 .9rem;line-height:1.6;}
    .ln-actions{display:flex;flex-wrap:wrap;gap:.6rem;}
    .ln-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:700;padding:.3rem .8rem;border-radius:999px;background:rgba(34,197,94,.15);color:var(--color-success);}
    .ln-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;}
    .ln-head h1{font-size:1.5rem;margin:.4rem 0 0;}
    .ln-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1.1rem;align-items:start;}
    @media(max-width:900px){.ln-grid{grid-template-columns:1fr;}}
    .ln-player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;margin-bottom:.8rem;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:.9rem;text-align:center;padding:1rem;}
    .ln-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
    .ln-now{font-weight:700;margin-bottom:1rem;}
    .ln-mod{margin-bottom:.9rem;}
    .ln-mod-title{font-size:.8rem;font-weight:700;color:var(--color-gold);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem;}
    .ln-lesson{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:var(--color-dark-3);border:1px solid transparent;border-radius:10px;padding:.65rem .8rem;margin-bottom:.35rem;color:var(--color-text-primary);font-family:inherit;font-size:.85rem;cursor:pointer;}
    .ln-lesson:hover,.ln-lesson.active{border-color:var(--color-gold);background:rgba(201,168,76,.08);}
    .ln-lesson i{color:var(--color-gold);width:16px;}
    .ln-lesson .soon{margin-left:auto;font-size:.68rem;color:var(--color-text-muted);}
    .ln-list{list-style:none;padding:0;margin:0 0 .9rem;}
    .ln-list li{font-size:.88rem;color:var(--color-text-secondary);padding:.35rem 0;display:flex;gap:.55rem;}
    .ln-list li i{color:var(--color-success);margin-top:.2rem;}
    .ln-file{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;padding:.8rem 0;border-top:1px solid rgba(255,255,255,.06);}
    .ln-file:first-of-type{border-top:0;}
    .ln-file span{font-size:.9rem;}
    .ln-center{text-align:center;padding:2rem 1rem;}
    .ln-center i.big{font-size:2.2rem;margin-bottom:.7rem;display:block;color:var(--color-gold);}
  </style>
</head>
