name = "claudefx-crypto-checkout"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Workers KV namespace — stores orders, download tokens, the audit log,
# and a cached Backblaze B2 auth token.
# Create with: wrangler kv namespace create ORDERS_KV
# Then paste the printed "id" below.
kv_namespaces = [
  { binding = "ORDERS_KV", id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE" }
]

# No R2 bucket here on purpose — Cloudflare R2 requires a payment method
# on file to activate, even for free-tier usage. Ebooks and course videos
# are stored in Backblaze B2 instead (genuinely free, no card at signup),
# accessed over HTTP rather than a Workers binding. Set these 3 secrets:
#   wrangler secret put B2_KEY_ID
#   wrangler secret put B2_APPLICATION_KEY
#   wrangler secret put B2_BUCKET_NAME
# See CLOUDFLARE_SETUP.md for exactly how to get each value.
